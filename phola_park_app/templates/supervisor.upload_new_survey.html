{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    {% include "partials/sidebar.html" %}

    <div class="content" style="padding:30px; max-width:700px;">
        <h1>Upload New Survey</h1>
        <p>Create a new survey for community members.</p>

        <form method="POST" action="{{ url_for('supervisor.upload_new_survey') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Survey Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label>Survey Type</label>
                <select name="survey_type" class="form-control" required>
                    <option value="">-- Select --</option>
                    <option value="Water">Water</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Housing">Housing</option>
                    <option value="Health">Health</option>
                    <option value="Safety">Safety</option>
                </select>
            </div>

            <div class="form-group">
                <label>Survey Link (Google Form or External URL)</label>
                <input type="url" name="link" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Publish Survey
            </button>

            <a href="{{ url_for('supervisor.surveys') }}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
