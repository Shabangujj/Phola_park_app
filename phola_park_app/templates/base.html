<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Phola Park App{% endblock %}
    </title>

    <!-- MAIN CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- TOPBAR -->
    {% include "partials/topbar.html" %}

    <!-- PAGE LAYOUT -->
    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                Phola Park
            </div>

            <a href="{{ url_for('main.admin_dashboard') }}">
                <i class="fas fa-home"></i>
                Dashboard
            </a>

            <a href="{{ url_for('admin.admin_users') }}">
                <i class="fas fa-users"></i>
                Users
            </a>

            <a href="{{ url_for('admin.view_reports') }}">
                <i class="fas fa-file-alt"></i>
                Reports
            </a>

            <a href="{{ url_for('admin.announcements') }}">
                <i class="fas fa-bullhorn"></i>
                Announcements
            </a>

            <a href="{{ url_for('admin.audit_logs') }}">
                <i class="fas fa-history"></i>
                Audit Logs
            </a>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

    <!-- FOOTER -->
    {% include "partials/footer.html" %}

    <!-- EXTRA JS -->
    {% block extra_js %}
    {% endblock %}

</body>
</html>
