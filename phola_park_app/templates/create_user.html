{% extends "base.html" %}
{% block content %}
<h2>Create New User (Admin Only)</h2>
<form method="POST">
    <label>Name:</label><br>
    <input type="text" name="name" required><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br>

    <label>Role:</label><br>
    <select name="role" required>
        <option value="user">User</option>
        <option value="supervisor">Supervisor</option>
        <option value="admin">Admin</option>
    </select><br><br>

    <button type="submit">Create</button>
</form>

<p><a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a></p>
<form method="POST">
  <input name="name" placeholder="Full name" required>
  <input name="email" type="email" required>
  <input name="password" type="password" required>

  <select name="role" id="role" required onchange="togglePortfolio()">
    {% for role in roles %}
      <option value="{{ role.name }}">{{ role.name.title() }}</option>
    {% endfor %}
  </select>

  <div id="portfolioBox" style="display:none;">
    <input name="portfolio" placeholder="Supervisor portfolio">
  </div>

  <button type="submit">Create User</button>
</form>

<script>
function togglePortfolio() {
  const role = document.getElementById("role").value;
  document.getElementById("portfolioBox").style.display =
    role === "supervisor" ? "block" : "none";
}
</script>

{% endblock %}
