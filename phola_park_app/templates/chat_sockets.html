<!DOCTYPE html>
<html>
<head>
  <title>Chat (Socket.IO)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body class="p-6 bg-gray-100">
  <div class="max-w-xl mx-auto bg-white p-4 rounded shadow">
    <h1 class="text-xl font-bold mb-4">📡 Live Group Chat</h1>
    <ul id="messages" class="mb-4 space-y-1"></ul>
    <form id="form">
      <input id="input" autocomplete="off" class="w-full border p-2 rounded" placeholder="Type your message" />
      <button class="bg-blue-600 text-white px-4 py-2 mt-2 rounded">Send</button>
    </form>
  </div>
  <script>
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');
    var messages = document.getElementById('messages');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (input.value) {
        socket.emit('message', input.value);
        input.value = '';
      }
    });

    socket.on('message', function(msg) {
      var item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
    });
  </script>
</body>
</html>
