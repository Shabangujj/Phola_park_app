{% extends 'base.html' %}
{% block content %}
<h2>Create Announcement</h2>
<form method="POST">
  <label>Title</label>
  <input type="text" name="title" required><br>
  
  <label>Message</label>
  <textarea name="message" required></textarea><br>
  
  <button type="submit">Post</button>
</form>
<a href="{{ url_for(session['role'] + '_dashboard') }}">⬅ Back</a>
{% endblock %}
