
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Description</th>
      <th>Supervisor ID</th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
    <tr>
      <td>{{ task.id }}</td>
      <td>{{ task.title }}</td>
      <td>{{ task.description }}</td>
      <td>{{ task.supervisor_id }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<div class="mt-4">
  <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
    ← Back to Dashboard
  </a>
</div>
