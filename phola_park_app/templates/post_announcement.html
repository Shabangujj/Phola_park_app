{% extends "base.html" %}
{% block content %}
<h2>Notice Board</h2>

<!-- Only show form if Admin or Supervisor -->
{% if session['role'] in ['admin', 'supervisor'] %}
<form method="POST" class="mb-4">
    <input type="text" name="title" placeholder="Title" class="form-control mb-2" required>
    <textarea name="content" placeholder="Write your notice here..." class="form-control mb-2" required></textarea>
    <button type="submit" class="btn btn-primary">Post Notice</button>
</form>
{% endif %}

<!-- Show notices for all users -->
<div class="mt-4">
    {% for n in notices %}
        <div class="card mb-2">
            <div class="card-body">
                <h5>{{ n[1] }}</h5>
                <p>{{ n[2] }}</p>
                <small class="text-muted">Posted on {{ n[3] }}</small>
            </div>
        </div>
    {% endfor %}
</div>
<div class="mt-4">
  <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
    ← Back to Dashboard
  </a>
{% endblock %}
