

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Content</th>
      <th>Task ID</th>
    </tr>
  </thead>
  <tbody>
    {% for report in reports %}
    <tr>
      <td>{{ report.id }}</td>
      <td>{{ report.title }}</td>
      <td>{{ report.content }}</td>
      <td>{{ report.task_id }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
