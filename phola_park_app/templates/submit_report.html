{% extends "base.html" %}
{% block title %}Submit Report{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Submit Report - Portfolio: {{ portfolio }}</h2>

  <form method="POST"
  action="{{ url_for('user.submit_report')}}" enctype="multipart/form-data" class="mt-3">
        {{ form.hidden_tag()}}
        {{ form.category_label }}
        {{ form.category }}
        {{ form.description.label }}
        {{ form.description }}
        {{ form.submit }}
    <div class="mb-3"> 
      <label class="form-label">Report Type</label>
      <select name="report_type" class="form-control" required>
        <option value="Service Delivery">Service Delivery</option>
        <option value="Crime">Crime</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" rows="4" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <input type="text" name="category" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Upload File (Image/PDF)</label>
      <input type="file" name="file" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Submit Report</button>
  </form>
</div>
<div class="mt-4">
  <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">
    ← Back
  </a>
{% endblock %}
