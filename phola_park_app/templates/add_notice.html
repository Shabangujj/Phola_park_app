{% extends "base.html" %}
{% block content %}

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
      <div class="container mt-4">
    <h2 class="mb-4">Add Notice</h2>
<form method="POST" action="{{ url_for('add_notice') }}">
  <div class="form-group">
    <label for="title">Notice Title</label>
    <input type="text" class="form-control" id="title" name="title" required>
  </div>

  <div class="form-group">
    <label for="message">Notice Message</label>
    <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
  </div>

  <button type="submit" class="btn btn-success">Save Notice</button>
  <a href="{{ url_for('manage_notices') }}" class="btn btn-secondary">Back</a>
</form>   
</div>
<div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="pinned" id="pinNotice" value="1">
            <label class="form-check-label" for="pinNotice">
                📌 Pin this notice (always show on top)
            </label>
        </div>
    </div>
</div>
<div class="mt-4">
  <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
    ← Back to Dashboard
  </a>
</div>

{% endblock %}
