<h2>Edit Project</h2>

<form method="POST">
    <input type="text" name="title" value="{{ project.title }}" required><br><br>

    <textarea name="description">{{ project.description }}</textarea><br><br>

    <input type="text" name="image" value="{{ project.image }}"><br><br>

    <input type="text" name="link" value="{{ project.link }}"><br><br>

    <button type="submit">Update Project</button>
</form>
