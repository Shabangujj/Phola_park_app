<!DOCTYPE html>
<html>
<head>
    <title>Manage Notices</title>
    <style>
        .notice-card {
            background: #f8f8f8;
            border-left: 4px solid #4CAF50;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .notice-card h3 { margin-top: 0; }
        .notice-actions {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Admin: Post Notice to All Users</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Notice Title" required><br>
        <textarea name="message" placeholder="Notice Message" required></textarea><br>
        <button type="submit">Post Notice</button>
    </form>

    <h2>Existing Notices</h2>
    {% for n in notices %}
    <div class="notice-card">
        <h3>{{ n['title'] }}</h3>
        <p>{{ n['message'] }}</p>
        <div class="notice-actions">
            <a href="{{ url_for('edit_notice', id=n['id']) }}">Edit</a> |
            <form action="{{ url_for('delete_notice', id=n['id']) }}" method="POST" style="display:inline;">
                <button type="submit" onclick="return confirm('Delete this notice?')">Delete</button>
            </form>
        </div>
    </div>
    {% endfor %}
   <div class="mt-4">
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">
    ← Back to Dashboard
  </a>
</div> 
</body>
</html>
