<nav style="background:#1e293b; 
padding:10px; color:white; display:flex; 
justify-content:space-between; 
align-items:center;">

<!-- LEFT -->
<div>
<strong>Phola Park App</strong>
</div>

    <!-- CENTER -->
    <div style="display:flex; gap:15px;">

        {% if session.get("role") == "admin" %}
            <a href="{{ url_for('main.admin_dashboard') }}" style="color:white;">Dashboard</a>
            <a href="{{ url_for('admin.admin_users') }}" style="color:white;">Users</a>
            <a href="{{ url_for('admin.view_reports') }}" style="color:white;">Reports</a>
            <a href="{{ url_for('admin.announcements') }}" style="color:white;">Announcements</a>
            <a href="{{ url_for('admin.audit_logs') }}" style="color:white;">Audit Logs</a>
        {% endif %}

        {% if session.get("role") == "supervisor" %}
            <a href="{{ url_for('supervisor.dashboard') }}" style="color:white;">Dashboard</a>
        {% endif %}

        {% if session.get("role") == "user" %}
            <a href="{{ url_for('user.dashboard') }}" style="color:white;">Dashboard</a>
        {% endif %}

    </div>

    <!-- RIGHT -->
    <div style="display:flex; align-items:center; gap:20px;">

        <!-- 🔔 Notifications -->
        <div style="position:relative; cursor:pointer;" onclick="toggleNotifications()">
            🔔 <span id="notif-count" style="color:red;">0</span>

            <div id="notif-dropdown" style="
                display:none;
                position:absolute;
                right:0;
                top:30px;
                background:white;
                color:black;
                width:300px;
                max-height:300px;
                overflow:auto;
                border-radius:5px;
                padding:10px;
            ">
                <ul id="notif-list" style="list-style:none; padding:0;"></ul>
            </div>
        </div>

        <!-- USER -->
        <span>{{ session.get("role") }}</span>

        <!-- LOGOUT -->
        <a href="{{ url_for('auth.logout') }}" style="color:white;">Logout</a>

    </div>

</nav>
