<div class="dashboard-card">

<h3>Recent Audit Logs</h3>

<table class="table table-striped">

<thead>

<tr>

<th>User</th>

<th>Action</th>

<th>Date</th>

</tr>

</thead>

<tbody>

{% if logs %}

{% for log in logs %}

<tr>

<td>{{ log.user.username if log.user else "System" }}</td>

<td>{{ log.action }}</td>

<td>{{ log.created_at.strftime("%d-%m-%Y %H:%M") }}</td>

</tr>

{% endfor %}

{% else %}

<tr>

<td colspan="3">

No audit logs found.

</td>

</tr>

{% endif %}

</tbody>

</table>

</div>
