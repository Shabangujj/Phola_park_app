{% if users is defined and users.pages > 1 %}

<div class="pagination">

    {% if users.has_prev %}

    <a href="{{ url_for('admin.admin_users',
        page=users.prev_num) }}">

        Previous

    </a>

    {% endif %}

    <span>

        Page {{ users.page }}

        of

        {{ users.pages }}

    </span>

    {% if users.has_next %}

    <a href="{{ url_for('admin.admin_users',
        page=users.next_num) }}">

        Next

    </a>

    {% endif %}

</div>

{% endif %}
