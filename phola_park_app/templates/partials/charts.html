<div class="charts-container"
    data-dates='{{ dates | default([]) | tojson | e }}'
    data-counts='{{ counts | default([]) | tojson | e }}'
    data-action-labels='{{ action_labels | default([]) | tojson | e }}'
    data-action-counts='{{ action_counts | default([]) | tojson | e }}'>

    <!-- Reports Chart -->
    <div class="dashboard-card">

        <h3>Reports by Portfolio</h3>

        <canvas id="reportsChart"></canvas>

    </div>

    <!-- Survey Chart -->
    <div class="dashboard-card">

        <h3>Survey Participation</h3>

        <canvas id="surveyChart"></canvas>

    </div>

</div>

<!-- ========================= -->
<!-- CHART.JS -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    console.log("Audit charts loading...");

    const chartsContainer = document.querySelector(".charts-container");

    function getChartData(name) {
        try {
            return JSON.parse(chartsContainer.dataset[name] || "[]");
        } catch (error) {
            console.error("Invalid chart data:", name, error);
            return [];
        }
    }

    const dates = getChartData("dates");
    const counts = getChartData("counts");
    const actionLabels = getChartData("actionLabels");
    const actionCounts = getChartData("actionCounts");


    console.log("Dates:", dates);
    console.log("Counts:", counts);
    console.log("Actions:", actionLabels);
    console.log("Action counts:", actionCounts);


    /* ========================= */
    /* LOGS PER DAY */
    /* ========================= */

    const logsCanvas =
        document.getElementById("logsChart");

    if (logsCanvas) {

        if (typeof Chart === "undefined") {

            console.error(
                "Chart.js failed to load."
            );

            return;
        }


        new Chart(logsCanvas, {

            type: "bar",

            data: {

                labels: dates,

                datasets: [{
                    label: "Logs per Day",
                    data: counts
                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            precision: 0

                        }

                    }

                }

            }

        });

    } else {

        console.error(
            "logsChart canvas not found."
        );

    }


    /* ========================= */
    /* ACTION DISTRIBUTION */
    /* ========================= */

    const actionsCanvas =
        document.getElementById("actionsChart");

    if (actionsCanvas) {

        new Chart(actionsCanvas, {

            type: "pie",

            data: {

                labels: actionLabels,

                datasets: [{
                    data: actionCounts
                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }

        });

    } else {

        console.error(
            "actionsChart canvas not found."
        );

    }

});
</script>
