<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Phola Park</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
    </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h2 class="title">Create an Account</h2>
        <p class="subtitle">Register to access Phola Park</p>
        <!--flash messages-->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
<form method="POST" >
  <!--Full Name-->
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <!--Email-->
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <!--Password-->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <!--Role-->
          <div class="form-group">
            <label>Select Role</label>
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="user">User</option>
              <option value="admin">Administrator</option>
              <option value="supervisor" onclick="togglePortfolio()">Supervisor</option>
            </select>
          </div>
          <!--Portfolio(visible only to superuser is selected)-->
          <div class="form-group" id="portfolio-group" style="display: none;">
            <label>Assigned Portfolio</label>
            <select name ="portfolio"><option value="">--Select Portfolio--</option></select>
            <option value="water">water</option>
            <option value="energy">energy</option>
            <option value="education">education</option>
            <option value="health">health</option>
            <option value="environment">environment</option>
            <option value="agriculture">agriculture</option>
            <option value="infrastructure">infrastructure</option>
            <option value="finance">finance</option>
            <option value="social">social</option>
            <option value="governance">governance</option>
            </select>
            </div>
            <!--Submit Button-->
            <div class="form-group">
              <button type="submit">Register</button>
            </div>
            <p class="switch-link">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
            </div>
            </div>
            <script>
              function togglePortfolio() {
                const role = document.getElementById('role').value;
                const portfolioField = document.getElementById('portfolio-group');
                portfolioField.style.display = (role === 'supervisor') ? 'block' : 'none';
              }
            </script>
            </body>
            </html>
