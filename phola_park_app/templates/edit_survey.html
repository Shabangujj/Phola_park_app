{% extends "base.html" %}

{% block title %}Edit Survey{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Edit Survey</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('supervisor.edit_survey', survey_id=survey.id) }}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Survey Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ survey.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ survey.description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="survey_type" class="form-label">Survey Type</label>
                            <input type="text" class="form-control" id="survey_type" name="survey_type" value="{{ survey.survey_type }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="link" class="form-label">Survey Link</label>
                            <input type="url" class="form-control" id="link" name="link" value="{{ survey.link }}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('supervisor.surveys') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Update Survey</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
