<h2>Edit Survey</h2>
<form method="POST">
    <input type="text" name="title" value="{{ survey.title }}" required><br><br>
    <textarea name="description">{{ survey.description }}</textarea><br><br>
    <input type="url" name="form_link" value="{{ survey.form_link }}" required><br><br>
    <button type="submit">Save Changes</button>
</form>
{% extends "base.html" %}
{% block title %}Edit Survey{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Edit Survey</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_survey', survey_id=survey['id']) }}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Survey Title</label>
                            <input type="text" class="form-control" id="title" name="title" 
                                   value="{{ survey['title'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" required>{{ survey['description'] }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="form_link" class="form-label">Form Link</label>
                            <input type="url" class="form-control" id="form_link" name="form_link" 
                                   value="{{ survey['form_link'] }}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('uploaded_surveys') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Update Survey</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
