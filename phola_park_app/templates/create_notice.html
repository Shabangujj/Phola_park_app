{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">📢 Post New Notice</h2>
    <form method="POST" action="{{ url_for('create_notice') }}" class="space-y-4 bg-white p-4 rounded shadow">
        <input type="text" name="title" placeholder="Notice Title" required class="w-full border p-2 rounded" />
        <textarea name="message" rows="4" placeholder="Write your message..." required class="w-full border p-2 rounded"></textarea>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Post Notice</button>
    </form>

    <hr class="my-6">

    <h3 class="text-xl font-semibold mb-2">📋 Existing Notices</h3>
    {% for notice in notices %}
    <div class="bg-gray-100 p-4 rounded shadow mb-4">
        <div class="flex justify-between items-center mb-1">
            <h4 class="text-lg font-semibold">{{ notice['title'] }}</h4>
            <small class="text-gray-500">{{ notice['created_at'] }}</small>
        </div>
        <p>{{ notice['message'] }}</p>
        <div class="mt-2 flex gap-2">
            <a href="{{ url_for('edit_notice', notice_id=notice['id']) }}" class="text-blue-600 hover:underline">Edit</a>
            <a href="{{ url_for('delete_notice', notice_id=notice['id']) }}" class="text-red-600 hover:underline" onclick="return confirm('Delete this notice?')">Delete</a>
        </div>
    </div>
    {% else %}
    <p class="text-gray-500">No notices yet.</p>
    {% endfor %}
</div>
{% endblock %}
