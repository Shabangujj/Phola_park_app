{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">✏️ Edit Notice</h2>
    <form method="POST" class="space-y-4 bg-white p-4 rounded shadow">
        <input type="text" name="title" value="{{ notice['title'] }}" required class="w-full border p-2 rounded" />
        <textarea name="message" rows="4" required class="w-full border p-2 rounded">{{ notice['message'] }}</textarea>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Update</button>
        <a href="{{ url_for('create_notice') }}" class="text-gray-600 ml-4">Cancel</a>
    </form>
</div>
{% endblock %}
