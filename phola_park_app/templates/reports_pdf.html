<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Phola Park Reports</title>
  <style>
    body { font-family: Arial, sans-serif; font-size:12px; color:#0A3152; }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; }
    th { background: #0A3152; color: #fff; }
    h2 { color:#0B9182; }
  </style>
</head>
<body>
  <h2>Phola Park - Reports</h2>
  <table>
    <thead><tr>
      <th>ID</th><th>Type</th><th>Category</th><th>Portfolio</th><th>Created</th><th>Description</th>
    </tr></thead>
    <tbody>
      {% for r in reports %}
      <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.report_type }}</td>
        <td>{{ r.category or '' }}</td>
        <td>{{ r.portfolio or '' }}</td>
        <td>{{ r.created_at.strftime('%Y-%m-%d %H:%M') if r.created_at else '' }}</td>
        <td>{{ r.description[:200] if r.description else '' }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
