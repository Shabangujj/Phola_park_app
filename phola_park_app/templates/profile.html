{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3 class="text-center">My Profile</h3>
    <div class="card shadow p-4 mt-3">
        <h5>{{ user['name'] }}</h5>
        <p><strong>Email:</strong> {{ user['email'] }}</p>
        <p><strong>Phone:</strong> {{ user['phone'] or 'Not added' }}</p>
        <p><strong>Address:</strong> {{ user['address'] or 'Not added' }}</p>
        <p><strong>Bio:</strong> {{ user['bio'] or 'No bio yet' }}</p>

        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#editProfileModal">
            Edit Profile
        </button>
    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="{{ url_for('edit_profile') }}" method="POST">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ user['name'] }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user['email'] }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ user['phone'] or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control" value="{{ user['address'] or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea name="bio" class="form-control">{{ user['bio'] or '' }}</textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
