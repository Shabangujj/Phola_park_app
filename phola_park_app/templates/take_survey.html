<!DOCTYPE html>
<html>
<head><title>Take Survey</title></head>
<body>
  <h2>Take Survey (User)</h2>
  <form>
    <label>Answer Question 1:</label><br>
    <input type="text" name="q1"><br><br>
    <label>Answer Question 2:</label><br>
    <input type="text" name="q2"><br><br>
    <button type="submit">Submit</button>
  </form>
  <a href="/user_dashboard">⬅ Back</a>
  <div id="surveyList"></div>

<script>
async function loadSurveys() {
    const surveys = await apiFetch("/api/surveys");

    const container = document.getElementById("surveyList");

    surveys.forEach(s => {
        container.innerHTML += `
            <div class="card p-3 mb-2">
                <h5>${s.title}</h5>
                <button onclick="submitSurvey(${s.id})">
                    Open Survey
                </button>
            </div>
        `;
    });
}

loadSurveys();
</script>
<script>
async function submitSurvey(id) {
    const answers = {
        q1: "Yes",
        q2: "No"
    };

    const result = await apiFetch(`/api/surveys/${id}/submit`, {
        method: "POST",
        body: JSON.stringify({ answers })
    });

    alert(result.message);
}
</script>

</body>
</html>
