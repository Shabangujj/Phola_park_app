{% extends "base.html" %}

{% block content %}

{% include "partials/topbar.html" %}

<div class="dashboard-card">

<h2>System Settings</h2>

<form method="POST">

<div class="form-group">

<label>Application Name</label>

<input
type="text"
name="app_name"
class="form-control"
value="Phola Park App">

</div>

<div class="form-group">

<label>Community Name</label>

<input
type="text"
name="community"
class="form-control"
value="Phola Park">

</div>

<div class="form-group">

<label>Enable Notifications</label>

<input
type="checkbox"
name="notifications"
checked>

</div>

<button
class="btn btn-success">

Save Settings

</button>

</form>

</div>

{% include "partials/footer.html" %}

{% endblock %}
