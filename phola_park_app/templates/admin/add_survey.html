{% extends "base.html" %}

{% block content %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
<h2>Add New Survey</h2>

<form method="POST" action="{{ url_for('admin.add_survey') }}">

    <div>
        <label>Survey Title</label><br>
        <input type="text" name="title" required style="width: 300px;">
    </div>

    <br>

    <div>
        <label>Description</label><br>
        <textarea name="description" rows="4" required style="width: 300px;"></textarea>
    </div>

    <br>

    <div>
        <label>Survey Type</label><br>
        <select name="survey_type" required>
            <option value="Survey1">Survey 1</option>
            <option value="Survey2">Survey 2</option>
            <option value="Survey3">Survey 3</option>
        </select>
    </div>

    <br>

    <button type="submit" style="padding: 8px 15px;">Create Survey</button>

</form>

<br>
<a href="{{ url_for('main.admin_dashboard') }}">⬅ Back to Dashboard</a>

        </footer>

{% endblock %}
