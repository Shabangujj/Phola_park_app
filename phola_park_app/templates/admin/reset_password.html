{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="container py-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h4>

<i class="fas fa-key"></i>

Reset Password

</h4>

</div>

<div class="card-body">

<h5>{{ user.username }}</h5>

<p>{{ user.email }}</p>

<form method="POST">

<div class="mb-3">

<label>New Password</label>

<input
type="password"
class="form-control"
name="password"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
class="form-control"
name="confirm_password"
required>
<small id="passwordHelp" class="text-muted">
Password should be at least 8 characters and include uppercase, lowercase, a number, and a special character.
</small>

</div>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('admin.user_details', user_id=user.id) }}"
class="btn btn-secondary">

Cancel

</a>

<button
type="submit"
class="btn btn-warning">

<i class="fas fa-save"></i>

Reset Password

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
