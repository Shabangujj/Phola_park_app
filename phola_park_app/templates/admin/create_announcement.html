{% extends "base.html" %}

{% block content %}

{% include "partials/topbar.html" %}

<div class="dashboard-card">

    <h2>📢 Create Announcement</h2>

    <p class="text-muted">
        Create a new community announcement.
    </p>

    <form method="POST"
          action="{{ url_for('admin.create_announcement') }}"
          class="auth-form">

        {% if csrf_token is defined %}
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">
        {% endif %}

        <!-- Title -->
        <div class="form-group">

            <label for="title">
                Announcement Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter announcement title"
                required
            >

        </div>


        <!-- Content -->
        <div class="form-group">

            <label for="content">
                Announcement Message
            </label>

            <textarea
                id="content"
                name="content"
                rows="7"
                placeholder="Write your announcement..."
                required
            ></textarea>

        </div>


        <!-- Target -->
        <div class="form-group">

            <label for="target">
                Target Audience
            </label>

            <select
                id="target"
                name="target"
                required
            >

                <option value="">
                    Select target audience
                </option>

                <option value="All">
                    Everyone
                </option>

                <option value="Users">
                    Users
                </option>

                <option value="Supervisors">
                    Supervisors
                </option>

                <option value="Admins">
                    Administrators
                </option>

            </select>

        </div>


        <!-- Buttons -->
        <div class="form-actions">

            <button
                type="submit"
                class="dashboard-btn"
            >
                📢 Publish Announcement
            </button>

            <a
                href="{{ url_for('admin.announcements') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% include "partials/footer.html" %}

{% endblock %}
