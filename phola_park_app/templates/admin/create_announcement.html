{% extends "base.html" %}

{% block content %}

{% include "partials/topbar.html" %}

<div class="dashboard-card">

    <h2>📢 Create Announcement</h2>

    <p class="text-muted">
        Create a new community announcement.
    </p>

<form method="POST"
      action="{{ url_for('admin.create_announcement') }}">
    
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            placeholder="Enter announcement title"
            required
        >

    </div>


    <div class="form-group">

        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            class="form-control"
            rows="6"
            placeholder="Enter announcement message"
            required
        ></textarea>

    </div>


    <div class="form-group">

        <label for="target_role">
            Target Role
        </label>

        <select
            id="target_role"
            name="target_role"
            class="form-control"
        >

            <option value="">
                All Users
            </option>

            <option value="user">
                Users
            </option>

            <option value="supervisor">
                Supervisors
            </option>

            <option value="admin">
                Administrators
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="portfolio">
            Portfolio
        </label>

        <input
            type="text"
            id="portfolio"
            name="portfolio"
            class="form-control"
            placeholder="Leave blank for all portfolios"
        >

    </div>


    <div class="form-group">

        <label for="priority">
            Priority
        </label>

        <select
            id="priority"
            name="priority"
            class="form-control"
        >

            <option value="Normal">
                Normal
            </option>

            <option value="Important">
                Important
            </option>

            <option value="Urgent">
                Urgent
            </option>

        </select>

    </div>


    <div class="form-actions">

        <button
            type="submit"
            class="dashboard-btn"
        >
            📢 Publish Announcement
        </button>

        <a
            href="{{ url_for('admin.announcements') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </div>

</form>
</div>

{% include "partials/footer.html" %}

{% endblock %}
