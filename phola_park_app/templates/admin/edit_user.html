{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fas fa-user-edit text-primary"></i>
                Edit User
            </h2>

            <p class="text-muted">
                Update user account information.
            </p>
        </div>

        <a href="{{ url_for('admin.users') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            Back

        </a>

    </div>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                <i class="fas fa-user"></i>
                User Details
            </h5>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            value="{{ user.name }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            value="{{ user.username }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ user.email }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Phone</label>

                        <input
                            type="text"
                            class="form-control"
                            name="phone"
                            value="{{ user.phone or '' }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Role</label>

                        <select
                            class="form-select"
                            name="role_id">

                            {% for role in roles %}

                            <option
                                value="{{ role.id }}"
                                {% if role.id==user.role_id %}selected{% endif %}>

                                {{ role.name|title }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Portfolio</label>

                        <select
                            class="form-select"
                            name="portfolio">

                            <option value="">
                                Select Portfolio
                            </option>

                            {% for portfolio in portfolios %}

                            <option
                                value="{{ portfolio }}"
                                {% if portfolio==user.portfolio %}selected{% endif %}>

                                {{ portfolio.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Status</label>

                        <select
                            class="form-select"
                            name="is_active">

                            <option
                                value="1"
                                {% if user.is_active %}selected{% endif %}>
                                Active
                            </option>

                            <option
                                value="0"
                                {% if not user.is_active %}selected{% endif %}>
                                Disabled
                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end">

                    <a href="{{ url_for('admin.users') }}"
                       class="btn btn-secondary me-2">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fas fa-save"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
