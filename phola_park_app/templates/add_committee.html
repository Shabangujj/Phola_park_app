{% extends "base.html" %}
{% block title %}Add Committee{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Add Committee</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Committee Name</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea name="description" id="description" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Add Committee</button>
        <a href="{{ url_for('committees') }}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
