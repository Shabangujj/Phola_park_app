{% extends "base.html" %}

{% block content %}
<h2>Assign Portfolio</h2>

<p><strong>Supervisor:</strong> {{ user.name }} ({{ user.email }})</p>

<form method="POST">
  <label>Select Portfolio</label>
  <select name="portfolio" class="form-control" required>
    {% for p in portfolios %}
      <option value="{{ p }}" {% if user.portfolio == p %}selected{% endif %}>
        {{ p }}
      </option>
    {% endfor %}
  </select>

  <br>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.admin_users') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
