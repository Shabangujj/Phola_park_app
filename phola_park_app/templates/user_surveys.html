{% extends "user_base.html" %}

{% block user_content %}
<h4>Active Surveys</h4>

<div class="row gy-2">
  {% for s in surveys %}
  <div class="col-12">
    <div class="card p-3 d-flex flex-row align-items-center justify-content-between shadow-sm">

      <!-- Survey Info -->
      <div>
        <div class="fw-bold">{{ s.name }}</div>
        <div class="small text-muted">
          Topic: {{ s.topic }}
        </div>
        <div class="small text-muted">
          Created: {{ s.created_at }}
        </div>
      </div>

      <!-- Action Button -->
      <div class="text-end">
        <a href="{{ url_for('web.take_survey', survey_id=s.id) }}" 
           class="btn btn-sm btn-primary">
           Take Survey
        </a>
      </div>

    </div>
  </div>

  {% else %}
  <div class="col-12">
    <p class="text-muted">No active surveys at the moment.</p>
  </div>
  {% endfor %}
</div>

{% endblock %}
