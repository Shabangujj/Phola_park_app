<!DOCTYPE html>
<html>
<head>
    <title>Announcements</title>
</head>
<body>
    <h2>Announcements</h2>

{% for a in announcements %}
  <div class="card mb-3">
    <div class="card-body">
      <h5>{{ a.title }}</h5>
      <p>{{ a.message }}</p>
      <small class="text-muted">
        {{ a.created_at.strftime("%Y-%m-%d %H:%M") }}
      </small>
    </div>
  </div>
{% else %}
  <p>No announcements.</p>
{% endfor %}

</body>
</html>
