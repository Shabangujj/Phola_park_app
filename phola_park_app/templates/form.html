<!-- templates/form.html -->
{% extends "base.html" %}
{% block title %}Registration Form{% endblock %}
{% block content %}
<h2>Community Member Registration</h2>
<form method="POST" enctype="multipart/form-data" action="{{ url_for('submit_cv') }}">

    <label>ID Number:</label>
    <input type="text" name="id_number" required>

    <label>Full Name:</label>
    <input type="text" name="full_name" required>

    <label>Age:</label>
    <input type="number" name="age" required>

    <label>Gender:</label>
    <input type="text" name="gender" required>

    <label>Indigenous/Class:</label>
    <input type="text" name="indigenous_class" required>

    <label>Postal Address:</label>
    <input type="text" name="postal_address">

    <label>Residential Address:</label>
    <input type="text" name="residential_address" required>

    <label>Email:</label>
    <input type="email" name="email">

    <label>Phone:</label>
    <input type="text" name="phone" required>

    <label>Skills:</label>
    <input type="text" name="skills" required>

    <label>Education:</label>
    <input type="text" name="education" required>

    <label>Employment Status:</label>
    <input type="text" name="employment_status" required>

    <label>Upload CV:</label>
    <input type="file" name="cv_file" required>

    <button type="submit">Register</button>
</form>
{% endblock %}
